- defaults:
    link:
      relink: true
      create: true

- clean: [ '~', '~/.config', '~/.ssh', '~/.config/upstart', '~/.config/autostart', '~' ]

- link:
    ~/.bashrc: .bashrc
    ~/.bash_aliases: .bash_aliases
    ~/.bash_profile: .bash_profile
    ~/.config/autostart/guake.desktop: .config/autostart/guake.desktop
    ~/.config/gtk-3.0/gtk.css: .config/gtk-3.0/gtk.css
    ~/.config/nvim/init.vim: .config/nvim/init.vim
    ~/.config/terminator/config: .config/terminator/config
    ~/.conky: .conky
    ~/.fonts/ge-inspira.ttf: .fonts/ge-inspira.ttf
    ~/.inputrc: .inputrc
    ~/.ipython/profile_default/ipython_config.py: .ipython/profile_default/ipython_config.py
    ~/.pam_environment: .pam_environment
    ~/.profile: .profile
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
    ~/.vim/ftplugin/gitcommit.vim: .vim/ftplugin/gitcommit.vim
    ~/.vim/plugin/cscope_maps.vim: .vim/plugin/cscope_maps.vim
    ~/.vimperatorrc: .vimperatorrc
    ~/.vimperator/colors: .vimperator/colors
    ~/.vimperator/plugin: .vimperator/plugin
- shell:
  -
    command: bin/desktopSettings.sh
    stdin: true
    stdout: true
  -
    command: bin/installVimStuff.sh
    stdin: true
    stdout: true
  -
    command: bin/keybindings.pl -i keybindings
    stdin: false
    stdout: false

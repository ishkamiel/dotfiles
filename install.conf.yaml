- defaults:
    link:
      relink: true
      create: true

- clean: [ '~', '~/.config', '~/.ssh', '~/.config/upstart', '~/.config/autostart', '~' ]

- link:
    ~/bin/dotfiles-keybindings_save: bin/dotfiles-keybindings_save
    ~/bin/dotfiles-push2host: bin/dotfiles-push2host
    ~/bin/dotfiles-update: bin/dotfiles-update
    ~/bin/vbox-windows: bin/vbox-windows
    ~/.chktexrc: .chktexrc
    ~/.config/conky/conky.conf: .config/conky/conky.conf
    ~/.config/conky/scripts: .config/conky/scripts
    ~/.config/nvim/ftdetect: .config/nvim/ftdetect
    ~/.config/nvim/ftplugin: .config/nvim/ftplugin
    ~/.config/nvim/indent: .config/nvim/indent
    ~/.config/nvim/init.vim: .config/nvim/init.vim
    ~/.config/nvim/syntax: .config/nvim/syntax
    ~/.config/nvim/vim-templates: .config/nvim/vim-templates
    ~/.config/zathura/zathurarc: .config/zathura/zathurarc
    ~/.doom.d : .doom.d
    ~/.gitignore_global: .gitignore_global
    ~/.inputrc: .inputrc
    ~/.ipython/profile_default/ipython_config.py: .ipython/profile_default/ipython_config.py
    ~/.latexmkrc: .latexmkrc
    ~/.local/share/applications/standard-notes.desktop: .local/share/applications/standard-notes.desktop
    ~/.local/share/applications/vbox-windows.desktop: .local/share/applications/vbox-windows.desktop
    ~/.local/share/applications/whatsapp.desktop: .local/share/applications/whatsapp.desktop
    ~/.local/share/icons/conky.png: .local/share/icons/conky.png
    ~/.local/share/icons/standard-notes.png: .local/share/icons/standard-notes.png
    ~/.local/share/icons/vbox-windows.png: .local/share/icons/vbox-windows.png
    ~/.local/share/icons/whatsapp.png: .local/share/icons/whatsapp.png
    ~/.pam_environment: .pam_environment
    ~/.perltidyrc: .perltidyrc
    ~/.profile: .profile
    ~/.spacemacs: .spacemacs
    ~/.xinitrc: .xinitrc
    ~/.Xresources: .Xresources
    ~/.zshrc: .zshrc
- shell:
  -
    command: scripts/desktopSettings.sh
    stdin: true
    stdout: true
  -
    command: scripts/install-vim_stuff.sh
    stdin: true
    stdout: true
  -
    command: scripts/install-OhMyZsh.sh
    stdin: true
    stdout: true
  -
    command: scripts/keybindings_apply.sh
    stdin: false
    stdout: false
  -
    command: scripts/checkLocalDotfiles.sh
    stdin: false
    stdout: true
  -
    command: scripts/gnome-shell-extensions.sh
    stdin: false
    stdout: true
  -
    command: scripts/apt_packages.sh
    stdin: false
    stdout: true

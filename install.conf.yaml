- defaults:
    link:
      relink: true
      create: true

- clean: [ '~', '~/.config', '~/.ssh', '~/.config/upstart', '~/.config/autostart', '~' ]

- link:
    ~/bin/dotfiles-keybindings_save: bin/dotfiles-keybindings_save
    ~/bin/dotfiles-push2host: bin/dotfiles-push2host
    ~/bin/dotfiles-update: bin/dotfiles-update
    ~/.chktexrc: .chktexrc
    ~/.config/kitty/kitty.conf: .config/kitty/kitty.conf
    ~/.config/nvim/ftplugin/gitcommit.vim: .config/nvim/ftplugin/gitcommit.vim
    ~/.config/nvim/init.vim: .config/nvim/init.vim
    ~/.config/nvim/vim-templates: .config/nvim/vim-templates
    ~/.config/zathura/zathurarc: .config/zathura/zathurarc
    ~/.gitignore_global: .gitignore_global
    ~/.inputrc: .inputrc
    ~/.ipython/profile_default/ipython_config.py: .ipython/profile_default/ipython_config.py
    ~/.latexmkrc: .latexmkrc
    ~/.pam_environment: .pam_environment
    ~/.profile: .profile
    ~/.zshrc: .zshrc
- shell:
  -
    command: scripts/desktopSettings.sh
    stdin: true
    stdout: true
  -
    command: scripts/installVimStuff.sh
    stdin: true
    stdout: true
  -
    command: scripts/install-OhMyZsh.sh
    stdin: true
    stdout: true
  -
    command: scripts/keybindings_apply.sh
    stdin: false
    stdout: false
  -
    command: scripts/checkLocalDotfiles.sh
    stdin: false
    stdout: true
  -
    command: scripts/gnome-shell-extensions.sh
    stdin: false
    stdout: true
  -
    command: scripts/apt_packages.sh
    stdin: false
    stdout: true

- link: 
    ~/.bashrc: link/bashrc
    ~/.bash_aliases: link/bash_aliases
    ~/.bash-colors.sh: link/bash-colors.sh
    ~/.config/i3status/config:
      create: true
      path: link/config/i3status/config
    ~/.config/roxterm.sourceforge.net/Shortcuts/Default:
      create: true
      path: link/config/roxterm.sourceforge.net/Shortcuts/Default
    ~/.config/roxterm.sourceforge.net/Profiles/Default:
      create: true
      path: link/config/roxterm.sourceforge.net/Profiles/Default
    ~/.config/roxterm.sourceforge.net/Colours/Default:
      create: true
      path: link/config/roxterm.sourceforge.net/Colours/Default
    ~/.config/roxterm.sourceforge.net/Global:
      create: true
      path: link/config/roxterm.sourceforge.net/Global
    ~/.config/roxterm.sourceforge.net/Global:
      create: true
      path: link/config/roxterm.sourceforge.net/Global
    ~/.gitconfig: link/gitconfig
    ~/.git-prompt.sh: link/git-prompt.sh
    ~/.i3/config:
      create: true
      path: link/i3/config
    ~/.pentadactylrc: link/pentadactylrc
    ~/.profile: link/profile
    ~/.themes/Uncomplicated-Mint:
      create: true
      path: link/themes/Uncomplicated-Mint
    ~/.vim/after/ftplugin:
      create: true
      path: link/vim/after/ftplugin
    ~/.vimrc: link/vimrc
    ~/.xmodmap_CapsEsc: link/xmodmap_CapsEsc
    ~/.Xresources: link/Xresources
- shell: 
  -
    command: bash scripts/install_i3.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/install_dev.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/install_ogreLibs.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/doInstalls.sh
    stdin: true 
    stdout: true
- clean: [ '~', '~/.config' ]

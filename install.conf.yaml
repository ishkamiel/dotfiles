- link: 
    ~/.bashrc: link/bashrc
    ~/.bash_aliases: link/bash_aliases
    ~/.bash-colors.sh: link/bash-colors.sh
    ~/.config/i3status/config:
      create: true
      path: link/config/i3status/config
    ~/.config/lxpanel:
      create: true
      path: link/config/lxpanel
    ~/.config/lxsession:
      create: true
      path: link/config/lxsession
    ~/.config/lxsession-default-apps:
      create: true
      path: link/config/lxsession-default-apps
    ~/.gitconfig: link/gitconfig
    ~/.git-prompt.sh: link/git-prompt.sh
    ~/.i3/config:
      create: true
      path: link/i3/config
    ~/.pentadactylrc: link/pentadactylrc
    ~/.pentadactyl/plugins:
      create: true
      path: link/pentadactyl/plugins
    ~/.profile: link/profile
    ~/.themes/Uncomplicated-Mint:
      create: true
      path: link/themes/Uncomplicated-Mint
    ~/.vim/after/ftplugin:
      create: true
      path: link/vim/after/ftplugin
    ~/.vim/spell:
      create: true
      path: link/vim/spell
    ~/.vimrc: link/vimrc
    ~/.xmodmap_CapsEsc: link/xmodmap_CapsEsc
    ~/.Xresources: link/Xresources
    ~/.Xresources.thigreal: link/Xresources.thigreal
- shell: 
  -
    command: vim +PluginUpdate +qall
    stdin: true 
    stdout: true
  -
    command: mkdir -p ~/.vimbackup
    stdin: false 
    stdout: false
  -
    command: bash scripts/install_i3.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/install_udk.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/install_dev.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/install_ogreLibs.sh
    stdin: true 
    stdout: true
  -
    command: bash scripts/doInstalls.sh
    stdin: true 
    stdout: true
- clean: [ '~', '~/.config' ]

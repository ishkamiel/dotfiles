- defaults:
    link:
      relink: true
      create: true

- clean: [ '~', '~/.config', '~/.ssh', '~/.config/upstart', '~/.config/autostart', '~' ]

- link:
    bash-it/themes/agnomod: lib/themes/agnomod
    ~/.bash_aliases: .bash_aliases
    ~/.bash_profile: .bash_profile
    ~/.bashrc: .bashrc
    ~/.byobu/.tmux.conf: .byobu/.tmux.conf
    ~/bin/dotfiles-keybindings_save: bin/dotfiles-keybindings_save
    ~/bin/dotfiles-push2host: bin/dotfiles-push2host
    ~/bin/dotfiles-update: bin/dotfiles-update
    ~/.chktexrc: .chktexrc
    ~/.config/nvim/init.vim: .vimrc
    ~/.config/terminator/config: .config/terminator/config
    ~/.conky: .conky
    ~/.fonts/ge-inspira.ttf: .fonts/ge-inspira.ttf
    ~/.inputrc: .inputrc
    ~/.ipython/profile_default/ipython_config.py: .ipython/profile_default/ipython_config.py
    ~/.latexmkrc: .latexmkrc
    ~/.pam_environment: .pam_environment
    ~/.profile: .profile
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
    ~/.vim/ftplugin/gitcommit.vim: .vim/ftplugin/gitcommit.vim
    ~/.vim/plugin/cscope_maps.vim: .vim/plugin/cscope_maps.vim
    ~/.vim/vim-templates: .vim/vim-templates
    ~/.zshrc: .zshrc
- shell:
  -
    command: scripts/desktopSettings.sh
    stdin: true
    stdout: true
  -
    command: scripts/installVimStuff.sh
    stdin: true
    stdout: true
  -
    command: scripts/keybindings_apply.sh
    stdin: false
    stdout: false
  -
    command: scripts/checkLocalDotfiles.sh
    stdin: false
    stdout: true
  -
    command: scripts/gnome-shell-extensions.sh
    stdin: false
    stdout: true
  -
    command: scripts/apt_packages.sh
    stdin: false
    stdout: true

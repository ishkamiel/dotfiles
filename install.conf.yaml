- defaults:
    link:
      relink: true
      create: true

- clean: [ '~', '~/.config', '~/.ssh', '~/.config/upstart', '~/.config/autostart', '~' ]

- link:
    ~/.bashrc: .bashrc
    ~/.bash: .bash
    ~/.config/autostart/conky.desktop: .config/autostart/conky.desktop
    ~/.config/autostart/guake.desktop: .config/autostart/guake.desktop
    ~/.config/gtk-3.0/gtk.css: .config/gtk-3.0/gtk.css
    ~/.config/terminator/config: .config/terminator/config
    ~/.conky: .conky
    ~/.fonts/ge-inspira.ttf: .fonts/ge-inspira.ttf
    ~/.gitconfig: .gitconfig
    ~/.inputrc: .inputrc
    ~/.pam_environment: .pam_environment
    ~/.profile: .profile
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
- shell:
  -
    command: scripts/gsettings.sh
    stdin: true
    stdout: true
#  -
#    command: vim +PluginInstall +qall
#    stdin: true
#    stdout: true

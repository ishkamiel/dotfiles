-- -*-Lua-*-
package.path = package.path .. string.format(";%s/.config/conky/scripts/?.lua", os.getenv('HOME'))
local git = require "git"
local utils = require "utils"
local myc = require "myconky"

local env_repos='TRACKED_REPOSITORIES'

do -- Setup
  utils.set_extra_replace({ EXECI_INTERVAL = 5 })
end

conky.config = {
	use_xft= true,
	xftalpha= .1,
	update_interval= 1,
	total_run_times= 0,

	background= true,

	own_window= true,
	own_window_type= 'desktop',
	own_window_transparent= true,
	own_window_hints= 'undecorated,below,sticky,skip_taskbar,skip_pager',
	own_window_colour= '000000',
	own_window_argb_visual= true,
	own_window_argb_value= 0,

	double_buffer= true,

	minimum_width= 480,
	maximum_width= 480,

	minimum_height= 10,

	draw_shades= false,
	draw_outline= true,
	draw_borders= false,
	draw_graph_borders= true,

	default_color= '999999',
	default_shade_color= 'AAAAAA',
	default_outline_color= 'black',
	color1 = 'A9A9A9',
	color3 = '222222',
  color9 = 'FF3333', -- dir not found
  color8 = 'FF3333', -- not a git repo

	alignment= 'top_right',
	gap_x= 6,
	gap_y= 31,
	no_buffers= true,
	text_buffer_size = 2048,
	uppercase= false,
	cpu_avg_samples= 4,
	net_avg_samples = 2,
	override_utf8_locale = true,

  lua_load = string.format("%s/.config/conky/scripts/conky_git.lua", os.getenv('HOME')),

	font = myc.get_font(12),
}


conky.text = '' ..
      myc.show_clock() ..
      utils.generate_symbol_width_string() ..
      "${voffset 150}\n" ..
      myc.show_ip_external() ..
      myc.show_net_info("eno2", utils.get_symbol('map_marker'), "ethernet") ..
      myc.show_net_info("wlo1", utils.get_symbol('wifi'), "wifi") ..
      "${hr}\n" ..
      myc.show_cpuinfo() ..
      "${hr}\n" ..
      -- show_gpu_info() ..
      -- "${hr}\n" ..
      -- Add repository information
      [[
##git##${goto 20} Repositories${lua_parse git_reset_cache}
]] .. git.gen_strings({
          repos = git.get_repos(env_repos),
          hide_non_repos = true,
          hide_clean = true,
          not_found = [[
${goto 20} ${color9}##excalamation_triangle## not found! ${alignr} ##NAME##${color}
]],
          not_a_repo = [[
${goto 20} ${color9}##excalamation_triangle## not a Git repo! ${alignr} ##NAME##${color}
]],
          is_repo = [[
${if_match "1"=="${lua_parse git_is_dirty ##PATH##}"}${color 00CC66}\
${else}${if_match "1"=="${lua_parse git_is_ahead ##PATH##}"}${color 33CC33}${endif}\
${endif}\
${goto 20} ##code_fork## \
${if_match "1"=="${lua_parse git_has_staged_changes ##PATH##}"}C${else} ${endif}\
${if_match "1"=="${lua_parse git_has_unstaged_changes ##PATH##}"}S${else} ${endif}\
${if_match "1"=="${lua_parse git_has_untracked_files ##PATH##}"}U${else} ${endif}\
${if_match "1"=="${lua_parse git_is_ahead ##PATH##}"}^${else} ${endif}\
${alignr}##NAME##${color}
]]
        }) ..
      "\n\n"

print("<conky.text>\n" .. conky.text .. "\n</conky.text>")


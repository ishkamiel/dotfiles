- clean: [ '~', '~/.config', '~/.ssh', '~/.ssh/upstart' ]
- link: 
    ~/.gitconfig: .gitconfig
    ~/.ssh/config:
      create: true
      path: .ssh/config
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
    ~/.inputrc: .inputrc
    ~/.config/upstart/mytempdir.conf:
      create: true
      path: .config/upstart/mytempdir.conf
    ~/.config/upstart/drop_down_terminal.conf:
      create: true
      path: .config/upstart/drop_down_terminal.conf
    ~/.zshrc: .zshrc
    ~/.zprofile: .zprofile
    ~/.zsh_favlist: .zsh_favlist
- shell: 
  -
    command: scripts/installStuff.sh
    stdin: true 
    stdout: true
  -
    command: scripts/dconf.sh
    stdin: true 
    stdout: true
#  -
#    command: vim +PluginInstall +qall
#    stdin: true 
#    stdout: true

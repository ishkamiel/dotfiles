- clean: [ '~', '~/.config', '~/.ssh', '~/.ssh/upstart' ]
- link: 
    ~/.gitconfig: .gitconfig
    ~/.ssh/config:
      create: true
      path: .ssh/config
    ~/.tmux.conf: .tmux.conf
    ~/.vimrc: .vimrc
    ~/.inputrc: .inputrc
    ~/.config/upstart/tempdirs.conf:
      create: true
      path: .config/upstart/tempdirs.conf
    ~/.config/upstart/drop_down_terminal.conf:
      create: true
      path: .config/upstart/drop_down_terminal.conf
    ~/.config/upstart/keyboard_config.conf:
      create: true
      path: .config/upstart/keyboard_config.conf
    ~/.zshrc: .zshrc
    ~/.zprofile: .zprofile
    ~/.zsh_favlist: .zsh_favlist
- shell: 
  -
    command: scripts/installStuff.sh
    stdin: true 
    stdout: true
  -
    command: mkdir -p ~/.vimbackup
    stdin: false 
    stdout: false
  -
    command: vim +PluginInstall +qall
    stdin: true 
    stdout: true

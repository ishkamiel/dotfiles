name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck zsh
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          fi

      - name: Install Python dependencies
        run: python -m pip install pytest pytest-xdist "tomli; python_version < '3.11'"

      - name: Run tests
        run: pytest tests/

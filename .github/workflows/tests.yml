name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Add chezmoi to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure chezmoi source
        run: |
          mkdir -p "$HOME/.config/chezmoi" "$HOME/.local/share"
          printf '[data]\n  machineType = "def"\n  isWork = false\n  isGaming = false\n  needBuildTools = false\n  isDebianLike = true\n  email = "ci@test"\n  name = "CI"\n' > "$HOME/.config/chezmoi/chezmoi.toml"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck zsh
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install shellcheck
          fi

      - name: Install Python dependencies
        run: pip install pytest pytest-xdist

      - name: Run tests
        run: pytest

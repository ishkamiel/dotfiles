# vim: ft=tmux.conf

# set the shell to use
if-shell "test -e /usr/bin/zsh" "set-option -g default-shell /usr/bin/zsh"
if-shell "test -e /bin/zsh" "set-option -g default-shell /bin/zsh"

# Source local tmux config if it exists
if-shell "test -e ~/.local.tmux.conf" "source-file ~/.local.tmux.conf"

# Set the default terminal to support 256 colors
set -g default-terminal "tmux-256color"

# Use vi keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Move panes with hjkl, without wrapping
bind h if-shell "[ $(tmux display-message -p '#{pane_at_left}') != 1 ]" "select-pane -L"
bind j if-shell "[ $(tmux display-message -p '#{pane_at_bottom}') != 1 ]" "select-pane -D"
bind k if-shell "[ $(tmux display-message -p '#{pane_at_top}') != 1 ]" "select-pane -U"
bind l if-shell "[ $(tmux display-message -p '#{pane_at_right}') != 1 ]" "select-pane -R"

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# For nested tmux
bind-key -n c-g send-prefix
bind-key -n c-t send-keys c-g

# Configure status bar and pane style
set -g status-position top
set -g status-style bg=colour235,fg=colour136
set -g status-style bg=colour237,fg=white
set-window-option -g window-status-current-style fg=colour40,bold
set-window-option -g window-status-style fg=colour244

# This seems to be required for neovim to immediately get ESC keypresses
set -sg escape-time 1

# Set window size to maximum for any client connected to *that* window
set -g aggressive-resize on

# Incrase scrollback history
set-option -g history-limit 10000

# Enable mouse
set -g mouse on

# Avoid login shells
set -g default-command "${SHELL}"

#
# Kitty configuration — used as a drop-down terminal via the Quake Terminal
# GNOME Shell extension (installed/configured by run_onchange_9_config_kitty_dropdown.sh).

# --- Font ---
# font.conf is generated at apply time by run_onchange_9_configure_fonts.sh
# using the same font-preference list as the GNOME monospace font setting.
# It contains a single `font_family <name>` line.
include font.conf
bold_font        auto
italic_font      auto
bold_italic_font auto

# --- Solarized Dark color scheme ---
# Matches the palette previously configured in Guake.
foreground #839496
background #002b36

selection_foreground #073642
selection_background #93a1a1

# Normal colors
color0  #073642
color1  #dc322f
color2  #859900
color3  #b58900
color4  #268bd2
color5  #d33682
color6  #2aa198
color7  #eee8d5

# Bright colors
color8  #002b36
color9  #cb4b16
color10 #586e75
color11 #657b83
color12 #839496
color13 #6c71c4
color14 #93a1a1
color15 #fdf6e3

# --- Window ---
hide_window_decorations yes
background_opacity      1.0

# --- Scrollback ---
scrollback_lines 4096

# --- Bell ---
enable_audio_bell no

# --- Mouse ---
# Disable mouse-driven URL opening on double-click to avoid conflicts
# with tmux mouse mode (the same class of bug that affected Guake).
open_url_with none

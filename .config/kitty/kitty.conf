font_size           13.0
font_family         Fira Code
bold_font           auto
italic_font         auto
bold_italic_font    auto
sync_to_monitor yes

background_opacity 0.9

hide_window_decorations yes
inactive_text_alpha 0.5

tab_bar_edge top
tab_bar_style separator

enabled_layouts Tall,Fat

kitty_mod alt
clear_all_shortcuts yes

map kitty_mod+enter new_window
map kitty_mod+k next_window
map kitty_mod+j previous_window

map kitty_mod+l next_tab
map kitty_mod+h previous_tab
map kitty_mod+n new_tab

map kitty_mod+; next_layout


# Colors based on: https://gist.github.com/NeoTheFox/afd26413899d6e0431f88546027144a6
# The color for the border of the active window
active_border_color #00ff00
# The color for the border of inactive windows
inactive_border_color #cccccc
# Tab-bar colors
active_tab_foreground #000
active_tab_background #eee
inactive_tab_foreground #444
inactive_tab_background #999
# The 16 terminal colors. There are 8 basic colors, each color has a dull and
# bright version.

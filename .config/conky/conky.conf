function font(s)
    return string.format('${font %s:style=Medium:pixelsize=%d}',
        conky.config.font, s)
end

function awesome(s, o)
    if o == 0 then
        return string.format('${font FontAwesome:style=Solid:size=10}%s${font}',
            s)
    else
        return string.format('${font FontAwesome:style=Solid:size=10}%s${font}${offset %d}',
            s, o)
    end
end

function get_cpuinfo()
    local cpu_model = nil
    local cpu_count = 0

    for line in io.lines('/proc/cpuinfo') do
        if not cpu_model then
            i, j = string.find(line, '^model name.*:')
            if i then
                cpu_model = string.sub(line, j+2)
            end
        end

        i, j = string.find(line, '^processor.*:')
        if i then
            cpu_count = string.sub(line, j+2)
        end
    end

    return cpu_model, tonumber(cpu_count)
end

s_wifi = awesome('', 4)
s_wired = awesome('', 4)
s_loc = awesome('', 10)
s_cpu = awesome('', 5)
s_temp = awesome('', 11)
s_down = awesome('', 7)
s_up = awesome('', 7)
s_empty = '${offset 19}'

function show_clock()
    return [[
${alignr}]] .. font(16) .. [[${time %A %d %B %Y}${font}
${voffset -30}
${alignr}]] .. font(50) .. [[${time %H:%M}${font}
]]
end

function show_ip(i, s, l)
    return string.format('${if_match "${addr %s}"!="No Address"}' ..
        "%s %s (%s) ${alignr}${addr %s}\n${endif}",
        i, s, l, i, i)
end

function show_ip_external()
    return string.format("%s external IP ${alignr}${exec curl -s ipinfo.io/ip}\n", s_loc)
end

function show_cpuinfo()
    local cpu_model, cpu_count = get_cpuinfo()
    local res = string.format("%s %s\n${voffset 4}", s_cpu, cpu_model)

    local i = 1
    repeat
        res = res .. string.format(s_empty ..
            " cpu%s:  ${cpu cpu%s}%% ${alignr}" ..
            "${exec awk '/cpu MHz/{i++}i==%s{printf \"%%.f\",$4; exit}' /proc/cpuinfo}" ..
            "MHz $alignr ${cpubar cpu%s 8,100}\n",
            i, i, i, i)
        i = i + 1;
    until i > cpu_count

    return res
end

function show_gpu_info()
    local f = assert(io.popen('nvidia-smi --query-gpu=name --format=csv | tail -n1', 'r'))
    local gpu_name = string.gsub(assert(f:read('*a')) , "\n", "")
    f:close()
    return string.format([[
%s %s
${voffset 4}%s gpu shader ${alignr}${exec nvidia-smi --query-gpu=clocks.gr --format=csv | tail -n1 }
%s gpu SM ${alignr}${exec nvidia-smi --query-gpu=clocks.sm --format=csv | tail -n1 }
%s gpu memory ${alignr}${exec nvidia-smi --query-gpu=clocks.mem --format=csv | tail -n1 }
]], s_empty, gpu_name, s_empty, s_empty, s_empty)
end

function show_temps()
    return string.format(
        "%s cpu temp ${alignr}${hwmon 2 temp 1} °C\n" ..
        "%s gpu temp ${alignr}${exec nvidia-smi --query-gpu=temperature.gpu --format=csv | tail -n1 } °C\n",
        s_temp, s_empty)
end

function if_has_if(i, s)
    return string.format('${if_match "${addr %s}"!="No Address"}%s${endif}', i, s)
end

function show_net_use(i, s, l)
    return if_has_if(i,
        string.format([[
${hr}
${color3}${downspeedgraph %s 50,480 99ccee 668899}${color}
${voffset -15}%s download (%s) ${alignr}${downspeedf %s}k/s (${totaldown %s})
${voffset -6}${hr}
${color3}${upspeedgraph %s 50,480 99ccee 668899}${color}
${voffset -15}%s upload (%s) ${alignr}${upspeedf %s}k/s (${totalup %s})
${voffset -6}${hr}
]],
            i, s_down, i, i, i,
            i, s_up, i, i, i))
end


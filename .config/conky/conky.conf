
do -- Utilities

  -- from: http://lua-users.org/wiki/RangeIterator
  --
  -- range(start)             returns an iterator from 1 to a (step = 1)
  -- range(start, stop)       returns an iterator from a to b (step = 1)
  -- range(start, stop, step) returns an iterator from a to b, counting by step.
  range =
  function (i, to, inc)
    if i == nil then return end -- range(--[[ no args ]]) -> return "nothing" to fail the loop in the caller

    if not to then
      to = i
      i  = to == 0 and 0 or (to > 0 and 1 or -1)
    end

    -- we don't have to do the to == 0 check
    -- 0 -> 0 with any inc would never iterate
    inc = inc or (i < to and 1 or -1)

    -- step back (once) before we start
    i = i - inc

    return function () if i == to then return nil end i = i + inc return i, i end
  end

  -- from: https://stackoverflow.com/a/26071044
  local bytemarkers = { {0x7FF,192}, {0xFFFF,224}, {0x1FFFFF,240} }
  function utf8(decimal)
    if decimal<128 then return string.char(decimal) end
    local charbytes = {}
    for bytes,vals in ipairs(bytemarkers) do
      if decimal<=vals[1] then
        for b=bytes+1,2,-1 do
          local mod = decimal%64
          decimal = (decimal-mod)/64
          charbytes[b] = string.char(128+mod)
        end
        charbytes[1] = string.char(vals[2]+decimal)
        break
      end
    end
    return table.concat(charbytes)
  end

  function toerr(s)
    io.stderr:write(s)
  end

  function get_gpuname()
    local f = assert(io.popen('nvidia-smi --query-gpu=name --format=csv | tail -n1', 'r'))
    local gpu_name = string.gsub(assert(f:read('*a')) , "\n", "")
    f:close()
    return gpu_name
  end

  local cpumodel
  local cpucount

  function __get_cpuinfo()
    local cpu_model = nil
    local cpu_count = 0

    for line in io.lines('/proc/cpuinfo') do
      if not cpu_model then
        i, j = string.find(line, '^model name.*:')
        if i then
          cpu_model = string.sub(line, j+2)
        end
      end

      i, j = string.find(line, '^processor.*:')
      if i then
        cpu_count = string.sub(line, j+2)
      end
    end

    return cpu_model, tonumber(cpu_count)
  end

  function get_cpumodel()
    if not cpumodel then cpumodel, cpucount = __get_cpuinfo() end
    return cpumodel
  end

  function get_cpucount()
    if not cpucount then cpumodel, cpucount = __get_cpuinfo() end
    return cpucount
  end
end

a_wid = ''
a_sym = {}
-- a_test_widths = true

do -- Setup
  local font_name = 'Fira Code'

  function get_font(size)
    return string.format('%s:style=Medium:size=%d', font_name, size)
  end

  function text_size(font_size, text)
    return string.format(
      '${font %s:style=Medium:pixelsize=%d}%s${font}',
      font_name, font_size, text)
  end

  function add_sym(name, unicode, offset)
    -- toerr(name)
    a_sym[name] = string.format(
      '${font forkawesome:style=Regular:size=10}%s${font}${offset %d}',
      utf8(unicode), offset)
    if a_test_widths then
      a_wid = a_wid .. string.format("%s | %s\n${voffset -12}", a_sym[name], name)
    end
  end

  function generate_symbols()
    -- Just an empty space for alignment
    add_sym('space', 0x020, 14)

    -- Symbols
    add_sym('at', 0xf1fa, 4)
    add_sym('bell', 0xf0f3, 3)
    add_sym('bluetooth', 0xf293, 5)
    add_sym('bluetooth-b', 0xf294, 8)
    add_sym('cogs', 0xf085, 1)
    add_sym('download', 0xf019, 3)
    add_sym('globe', 0xf0ac, 4)
    add_sym('hdd', 0xf0a0, 4)
    add_sym('microchip', 0xf2db, 4)
    add_sym('microphone', 0xf130, 6)
    add_sym('plug', 0xf1e6, 2)
    add_sym('map-marker', 0xf041, 7)
    add_sym('pin', 0xf276, 7)
    add_sym('thermometer_full', 0xf2c7, 7)
    add_sym('thumbtack', 0xf08d, 6)
    add_sym('upload', 0xf093, 3)
    add_sym('wifi', 0xf1eb, 0)

    -- Symbols that don't work :(
    add_sym('ethernet', 0xf796, 0)
    add_sym('map-marker-alt', 0xf3c5, 10)
    add_sym('memory', 0xf538, 0)
    add_sym('mouse', 0xf8cc, 0)
    add_sym('network-wired', 0xf6ff, 8)
    add_sym('temperature-high', 0xf769, 5)
    add_sym('temperature-low', 0xf76b, 5)

    if a_test_widths then
      a_wid = a_wid .. "${goto 20} |\n"
    end
  end

  function replace_symbols(text, other_subs)
    for name, value in pairs(a_sym) do
      text = string.gsub(text, string.format('##%s##', name), value)
    end

    if other_subs then
      for name, value in pairs(other_subs) do
        text = string.gsub(text, string.format('##%s##', name), value)
      end
    end

    return text
  end

  generate_symbols()
end


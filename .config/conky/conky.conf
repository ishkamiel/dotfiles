function show_clock()
  return string.format([[
${alignr}%s
${voffset -25}
${alignr}%s
]],
    text_size(50, '${time %H:%M}'),
    text_size(16, '${time %A %d %B %Y}'))
end

function show_ip_external()
  return utils.replace([[
##globe## external IP ${alignr}${exec curl -s ipinfo.io/ip}
]])
end

function show_cpuinfo()
  local res = utils.replace([[
##microchip##${goto 20} ##CPU_MODEL##
${goto 20} ##thermometer_full## temp: ${hwmon 2 temp 1} °C\
${voffset 4}
]], { CPU_MODEL = get_cpumodel() })

  for i in utils.range(get_cpucount()+1) do res = res .. utils.replace([[
${goto 20} ##LABEL## ${cpu cpu##NUM##}%\
${alignr}${exec awk '/cpu MHz/{i++}i==##NUM##{printf "%.f",$4; exit}' /proc/cpuinfo}MHz \
${cpubar cpu##NUM## 8,100}
]], { NUM = i, LABEL = string.format('cpu%d%s', i,
          (function() if i < 10 then return ' ' else return '' end end)()) })
  end

  return res
end

function show_gpu_info()
    return utils.replace([[
##cogs##${goto 20} ##GPU_NAME##
${goto 20} ##thermometer_full## temp: ${nvidia gputemp} °C ${alignr}fan: ${nvidia fanspeed}%% ${voffset 4}
${goto 20} shader ${nvidia gpuutil}% ${alignr}${nvidia gpufreqcur}MHz ${nvidiabar 8,100 gpufreqcur}
${goto 20} memory ${nvidia memutil}% ${alignr}${nvidia memfreqcur}MHz ${nvidiabar 8,100 memfreqcur}
]], { GPU_NAME = get_gpuname() })
end

function show_net_info(interface, symbol, label)
    return utils.replace([[
${if_match "${addr ##INTERFACE##}"!="No Address"}\
##SYMBOL## ##LABEL## (##INTERFACE##) ${alignr}${addr ##INTERFACE##}
${voffset 4}\
${offset 20}##download## download ${alignr}${downspeedf ##INTERFACE##}k/s (${totaldown ##INTERFACE##})
${voffset -06}\
${offset 20}${color3}${downspeedgraph ##INTERFACE## 50,455 555577 8888AA -t -l}${color}
${voffset -10}\
${offset 20}##upload## upload ${alignr}${upspeedf ##INTERFACE##}k/s (${totalup ##INTERFACE##})
${voffset -06}\
${offset 20}${color3}${upspeedgraph ##INTERFACE## 50,455 775555 AA8888 -t}${color}
${endif}\
]], { INTERFACE = interface, LABEL = label, SYMBOL = symbol })
end

conky.text = '' ..
      show_clock() ..
      utils.generate_symbol_width_string() ..
      "${voffset 150}\n" ..
      show_ip_external() ..
      show_net_info("eno2", utils.get_symbol('map_marker'), "ethernet") ..
      show_net_info("wlo1", utils.get_symbol('wifi'), "wifi") ..
      "${hr}\n" ..
      show_cpuinfo() ..
      "${hr}\n" ..
      show_gpu_info() ..
      "${hr}\n" ..
      -- Add repository information
      [[
##git##${goto 20} Repositories${lua_parse git_reset_cache}
]] .. git.gen_strings({
          repos = git.get_repos(env_repos),
          hide_non_repos = true,
          hide_clean = true,
          not_found = [[
${goto 20} ${color9}##excalamation_triangle## not found! ${alignr} ##NAME##${color}
]],
          not_a_repo = [[
${goto 20} ${color9}##excalamation_triangle## not a Git repo! ${alignr} ##NAME##${color}
]],
          is_repo = [[
${if_match "1"=="${lua_parse git_is_dirty ##PATH##}"}${color 00CC66}\
${else}${if_match "1"=="${lua_parse git_is_ahead ##PATH##}"}${color 33CC33}${endif}\
${endif}\
${goto 20} ##code_fork## \
${if_match "1"=="${lua_parse git_has_staged_changes ##PATH##}"}C${else} ${endif}\
${if_match "1"=="${lua_parse git_has_unstaged_changes ##PATH##}"}S${else} ${endif}\
${if_match "1"=="${lua_parse git_has_untracked_files ##PATH##}"}U${else} ${endif}\
${if_match "1"=="${lua_parse git_is_ahead ##PATH##}"}^${else} ${endif}\
${alignr}##NAME##${color}
]]
        }) ..
      "\n\n"


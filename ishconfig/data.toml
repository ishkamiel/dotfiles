# Data template for ishfiles.
# Each table defines a variable that ishfiles will prompt for if not already
# set in ~/.config/ishfiles/config.toml under [data].
#
# Keys:
#   prompt  - the question shown to the user
#   default - value used when the user presses Enter without typing

[machineType]
type = "ordered_tags"
values = ["min", "def", "personal"]
default = "def"
isholate = "min"

[email]
prompt = "Email address"
default = "hans@liljestrand.dev"

[name]
prompt = "Full name"
default = "Hans Liljestrand"

[isWork]
type = "bool"
default = false
isholate = false

[isGaming]
type = "bool"
default = false
isholate = false

[needBuildTools]
prompt = "Install build tools?"
type = "bool"
default = false
isholate = false

[isGui]
type = "bool"
default = false
isholate = false

[isGnome]
type = "bool"
default = false
isholate = false

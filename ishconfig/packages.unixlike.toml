#
# Unix-like package configuration for ishfiles.
#
# All packages in this file implicitly have only_on = ["unixlike"] applied,
# meaning they are only installed on Linux and macOS (not Windows).
#
# Packages with an explicit only_on are further restricted: the file-level
# tag is prepended, so only_on = ["debian"] here becomes effectively
# only_on = ["unixlike", "debian"] — i.e. Debian-family Linux only.
#
# Fields: see packages.toml for field documentation.
#
# Tags use data variable names from ishconfig/data.toml:
#   min, def, personal  — via machineType (ordered_tags)
#   needBuildTools      — build tool packages (bool)
#   isWork              — work-only packages (bool)
#   !isWork             — personal/non-work packages (bool, negated)
#   isGaming            — gaming packages (bool)
#
# GUI/GNOME packages that were previously tagged gui/gnome are now tagged
# "def" so they install on all non-min machines. Runtime GUI detection
# will be reintroduced as a separate mechanism later.

# ---------------------------------------------------------------------------
# Core / minimum packages  (tags = ["min"], installed on all machine types)
# ---------------------------------------------------------------------------

[git]
apt = "git"
dnf = "git"
tags = ["min"]

[neovim]
apt = "neovim"
dnf = "neovim"
tags = ["min"]

[tmux]
apt = "tmux"
dnf = "tmux"
tags = ["min"]

[vim]
apt = "vim-nox"
dnf = "vim-enhanced"
tags = ["min"]

[zsh]
apt = "zsh"
dnf = "zsh"
tags = ["min"]

# ---------------------------------------------------------------------------
# Default packages  (tags = ["def"], installed when machineType != "min")
# ---------------------------------------------------------------------------

[apt_file]
apt = "apt-file"
only_on = ["debian"]
tags = ["def"]

[aptitude]
apt = "aptitude"
only_on = ["debian"]
tags = ["def"]

[bat]
apt = "bat"
dnf = "bat"
optional = true
tags = ["def"]


# Package definitions for cross-platform installation.
#
# Fields per entry:
#   apt         = package name for apt (omit if not available on this manager)
#   dnf         = package name for dnf (omit if not available on this manager)
#   brew        = package name for brew (omit if not available on this manager)
#   cargo       = crate name for cargo (omit if not available via cargo)
#   winget      = package ID for winget (omit if not available on this manager)
#   min         = true → install on all machine types including "min" (default: false)
#   build_tools = true → only install when needBuildTools is set (default: false)
#   work        = true → only install when isWork is set (default: false)
#   no_work     = true → only install when isWork is NOT set (default: false)
#   gaming      = true → only install when isGaming is set (default: false)
#   personal    = true → only install when machineType == "personal" (default: false)
#   optional    = true → suppress errors if package unavailable (default: false)

# ---------------------------------------------------------------------------
# Core / minimum packages  (min = true, installed on all machine types)
# ---------------------------------------------------------------------------

[packages.git]
  apt = "git"
  dnf = "git"
  winget = "Git.Git"
  min = true

[packages.neovim]
  apt = "neovim"
  dnf = "neovim"
  winget = "Neovim.Neovim"
  min = true

[packages.tmux]
  apt = "tmux"
  dnf = "tmux"
  min = true

[packages.wl-clipboard]
  apt = "wl-clipboard"
  dnf = "wl-clipboard"
  gui-only = true

[packages.xclip]
  apt = "xclip"
  dnf = "xclip"
  gui-only = true

[packages.vim]
  apt = "vim-nox"
  dnf = "vim-enhanced"
  min = true

[packages.zsh]
  apt = "zsh"
  dnf = "zsh"
  min = true

